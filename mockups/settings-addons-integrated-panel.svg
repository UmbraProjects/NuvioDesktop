    <text class="muted body" x="88" y="508" font-weight="700">Example disabled addon</text>
    <text class="dim small" x="88" y="530">Version 1.4.0</text>
    <text class="dim body" x="396" y="522">1</text>
    <text class="dim body" x="536" y="522">14</text>
    <rect class="chip" x="662" y="498" width="80" height="30" rx="15"/>
