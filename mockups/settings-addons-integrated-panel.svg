<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .bg { fill: #000000; }
      .line { stroke: #0f4a70; stroke-width: 1; opacity: 0.72; }
      .soft-line { stroke: #30363a; stroke-width: 1; opacity: 0.82; }
      .text { fill: #e8ebef; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #a3abb4; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .dim { fill: #7f8993; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .accent { fill: #2d9cff; }
      .accent-stroke { stroke: #2d9cff; }
      .card { fill: #242829; }
      .row-selected { fill: #142832; stroke: #2d9cff; stroke-width: 1; }
      .field { fill: #30363a; stroke: #42494e; stroke-width: 1; }
      .chip { fill: #343a3f; }
      .chip-on { fill: #3a4146; }
      .btn { fill: #2d9cff; }
      .popover { fill: #1d2022; stroke: #3a4146; stroke-width: 1; }
      .danger { fill: #ff6d9e; }
      .ok { fill: #40d5d5; }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 18px; font-weight: 700; letter-spacing: 0.4px; }
      .h3 { font-size: 15px; font-weight: 800; letter-spacing: 1px; }
      .body { font-size: 16px; font-weight: 500; }
      .small { font-size: 13px; font-weight: 500; }
      .tiny { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>

  <!-- settings shell -->
