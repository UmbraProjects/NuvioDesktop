  <line class="line" x1="1786" y1="0" x2="1786" y2="1280"/>
  <line class="line" x1="0" y1="112" x2="1800" y2="112"/>
  <line class="line" x1="335" y1="112" x2="335" y2="1280"/>
  <line class="line" x1="1375" y1="112" x2="1375" y2="1280"/>

  <!-- top bar -->
  <circle cx="82" cy="56" r="24" fill="#c9272f"/>
  <circle cx="82" cy="51" r="13" fill="#f2c1a0"/>
  <rect x="70" y="62" width="24" height="14" rx="7" fill="#234760"/>
  <path d="M156 42 C149 42 145 47 145 54 L145 63 L141 69 L171 69 L167 63 L167 54 C167 47 163 42 156 42 Z" fill="#a3abb4"/>
  <circle cx="156" cy="75" r="3" fill="#a3abb4"/>
  <path d="M243 42 L243 60" stroke="#a3abb4" stroke-width="4" stroke-linecap="round"/>
  <path d="M233 52 C227 61 233 73 243 73 C253 73 259 61 253 52" fill="none" stroke="#a3abb4" stroke-width="4" stroke-linecap="round"/>
