      <path d="M52 4 L52 22 M52 4 L44 12 M52 4 L60 12" opacity="0.35"/>
      <path d="M91 10 C95 3 106 4 109 11 M110 4 L110 12 L102 12 M110 20 C106 27 95 26 92 19 M91 26 L91 18 L99 18"/>
      <path d="M142 22 L162 22 M146 18 L158 6 L164 12 L152 24 L146 24 Z" class="accent-stroke"/>
      <path d="M194 8 L214 8 M199 8 L201 26 L211 26 L213 8 M202 8 L202 4 L210 4 L210 8" stroke="#ff6d9e"/>
    </g>

