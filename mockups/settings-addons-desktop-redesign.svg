<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .bg { fill: #000000; }
      .line { stroke: #0f4a70; stroke-width: 1; opacity: 0.72; }
      .soft-line { stroke: #293238; stroke-width: 1; opacity: 0.78; }
      .text { fill: #e8ebef; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #9aa3ad; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .dim { fill: #6f7882; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .accent { fill: #2d9cff; }
      .card { fill: #141719; }
      .card2 { fill: #191d20; }
      .field { fill: #252a2e; stroke: #343b40; stroke-width: 1; }
      .chip { fill: #2b3034; }
      .selected { fill: #10202a; stroke: #1e83c9; stroke-width: 1; }
      .btn { fill: #2d9cff; }
      .btn-disabled { fill: #3d4144; }
      .danger { fill: #ff6d9e; }
      .warn { fill: #ffc167; }
      .ok { fill: #31d07d; }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 18px; font-weight: 700; letter-spacing: 0.4px; }
      .h3 { font-size: 16px; font-weight: 700; letter-spacing: 0.8px; }
      .body { font-size: 16px; font-weight: 500; }
      .small { font-size: 13px; font-weight: 500; }
      .tiny { font-size: 12px; font-weight: 600; letter-spacing: 0.6px; }
      .num { font-size: 22px; font-weight: 750; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>

  <!-- outer shell -->
  <line class="line" x1="14" y1="0" x2="14" y2="1280"/>
  <line class="line" x1="1786" y1="0" x2="1786" y2="1280"/>
  <line class="line" x1="0" y1="112" x2="1800" y2="112"/>
  <line class="line" x1="335" y1="112" x2="335" y2="1280"/>
  <line class="line" x1="1375" y1="112" x2="1375" y2="1280"/>

  <!-- top bar -->
  <circle cx="82" cy="56" r="24" fill="#c9272f"/>
  <circle cx="82" cy="51" r="13" fill="#f2c1a0"/>
  <rect x="70" y="62" width="24" height="14" rx="7" fill="#234760"/>
  <text class="text body" x="149" y="63">bell</text>
  <text class="text body" x="236" y="63">power</text>
  <rect class="field" x="1400" y="28" width="350" height="60" rx="15"/>
  <circle cx="1430" cy="57" r="8" fill="none" stroke="#9aa3ad" stroke-width="3"/>
  <line x1="1436" y1="63" x2="1445" y2="72" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/>
  <text class="muted body" x="1462" y="64">Search</text>

  <!-- sidebar -->
  <text class="text h1" x="44" y="165">Categories</text>
  <g transform="translate(46,200)">
    <text class="accent body" x="0" y="18">++</text>
    <text class="text body" x="44" y="18" font-weight="700">Addons</text>
  </g>
  <g transform="translate(46,252)">
    <rect x="0" y="-14" width="22" height="22" rx="3" fill="none" stroke="#aeb6bf" stroke-width="3"/>
    <text class="muted body" x="44" y="7">Collections</text>
  </g>
  <g transform="translate(46,304)">
    <rect x="0" y="-14" width="22" height="22" rx="3" fill="none" stroke="#aeb6bf" stroke-width="3"/>
    <text class="muted body" x="44" y="7">Cont Watching</text>
  </g>
  <g transform="translate(46,356)">
    <text class="muted body" x="0" y="7">sl</text>
    <text class="muted body" x="44" y="7">Detail Page</text>
  </g>
  <g transform="translate(46,408)">
    <text class="muted body" x="0" y="7">++</text>
    <text class="muted body" x="44" y="7">Fork Additions</text>
  </g>
  <g transform="translate(46,460)">
    <text class="muted body" x="0" y="7">gear</text>
    <text class="muted body" x="44" y="7">Home Layout</text>
  </g>
  <g transform="translate(46,512)">
    <text class="muted body" x="0" y="7">link</text>
    <text class="muted body" x="44" y="7">Integrations</text>
  </g>
  <g transform="translate(46,564)">
    <text class="muted body" x="0" y="7">user</text>
    <text class="muted body" x="44" y="7">Account</text>
  </g>
  <g transform="translate(46,616)">
    <text class="muted body" x="0" y="7">pal</text>
    <text class="muted body" x="44" y="7">Layout</text>
  </g>
  <g transform="translate(46,668)">
    <text class="muted body" x="0" y="7">play</text>
    <text class="muted body" x="44" y="7">Playback</text>
  </g>
  <g transform="translate(46,720)">
    <text class="muted body" x="0" y="7">plug</text>
    <text class="muted body" x="44" y="7">Plugins</text>
  </g>
  <g transform="translate(46,772)">
    <text class="muted body" x="0" y="7">sl</text>
    <text class="muted body" x="44" y="7">Streams</text>
  </g>

  <!-- main panel -->
  <g transform="translate(382,145)">
    <text class="muted h3" x="0" y="12">OVERVIEW</text>

    <!-- compact summary row -->
    <rect class="card" x="0" y="34" width="944" height="82" rx="10"/>
    <g transform="translate(0,34)">
      <text class="num text" x="42" y="36">2</text>
      <text class="muted small" x="75" y="36">installed</text>
      <text class="num text" x="220" y="36">2</text>
      <text class="muted small" x="253" y="36">active</text>
      <text class="num text" x="386" y="36">432</text>
      <text class="muted small" x="438" y="36">catalogs</text>
      <text class="num text" x="590" y="36">15</text>
      <text class="muted small" x="625" y="36">id rules</text>
      <rect class="chip" x="754" y="18" width="148" height="34" rx="17"/>
      <text class="muted small" x="780" y="40">all healthy</text>
      <circle class="ok" cx="870" cy="29" r="5"/>
    </g>

    <!-- install row -->
    <text class="muted h3" x="0" y="156">ADD ADDON</text>
    <rect class="card" x="0" y="176" width="944" height="78" rx="10"/>
    <rect class="field" x="24" y="197" width="662" height="36" rx="8"/>
    <text class="muted body" x="42" y="221">Paste addon manifest URL</text>
    <rect class="btn-disabled" x="706" y="197" width="148" height="36" rx="8"/>
    <text class="dim body" x="735" y="221" font-weight="700">Install</text>
    <rect class="chip" x="870" y="197" width="50" height="36" rx="8"/>
    <text class="muted body" x="886" y="221">...</text>

    <!-- manager toolbar -->
    <text class="muted h3" x="0" y="300">INSTALLED ADDONS</text>
    <rect class="field" x="0" y="320" width="300" height="38" rx="8"/>
    <circle cx="22" cy="339" r="6" fill="none" stroke="#9aa3ad" stroke-width="2"/>
    <line x1="27" y1="344" x2="34" y2="351" stroke="#9aa3ad" stroke-width="2" stroke-linecap="round"/>
    <text class="muted small" x="48" y="344">Filter installed addons</text>
    <rect class="chip" x="316" y="320" width="80" height="38" rx="8"/>
    <text class="text small" x="336" y="344">Active</text>
    <rect class="chip" x="406" y="320" width="110" height="38" rx="8"/>
    <text class="muted small" x="429" y="344">Catalogs</text>
    <rect class="chip" x="526" y="320" width="118" height="38" rx="8"/>
    <text class="muted small" x="548" y="344">Configurable</text>
    <rect class="chip" x="814" y="320" width="130" height="38" rx="8"/>
    <text class="muted small" x="838" y="344">Sort: Order</text>

    <!-- table -->
    <rect class="card" x="0" y="382" width="944" height="284" rx="10"/>
    <text class="dim tiny" x="24" y="416">ADDON</text>
    <text class="dim tiny" x="410" y="416">RESOURCES</text>
    <text class="dim tiny" x="560" y="416">CATALOGS</text>
    <text class="dim tiny" x="690" y="416">STATUS</text>
    <text class="dim tiny" x="800" y="416">ACTIONS</text>
    <line class="soft-line" x1="24" y1="434" x2="920" y2="434"/>

