    <rect class="selected" x="16" y="448" width="912" height="66" rx="8"/>
    <rect x="34" y="462" width="38" height="38" rx="9" fill="#1b3033"/>
    <circle cx="53" cy="481" r="12" fill="none" stroke="#36c6d2" stroke-width="3"/>
    <text class="text body" x="88" y="476" font-weight="700">AIOMetadata</text>
    <text class="muted small" x="88" y="498">Version 2.7.1</text>
    <text class="muted body" x="410" y="490">3</text>
    <text class="muted body" x="560" y="490">432</text>
    <rect class="chip" x="690" y="466" width="68" height="30" rx="15"/>
    <text class="text small" x="707" y="486">Active</text>
    <text class="muted body" x="802" y="490">down</text>
    <text class="muted body" x="852" y="490">refresh</text>
    <text class="accent body" x="910" y="490">edit</text>

    <!-- normal row -->
    <line class="soft-line" x1="24" y1="532" x2="920" y2="532"/>
    <rect x="34" y="550" width="38" height="38" rx="9" fill="#272b2e"/>
    <text class="text body" x="42" y="575" font-weight="800">AU</text>
    <text class="text body" x="88" y="564" font-weight="700">AIOUmbra</text>
    <text class="muted small" x="88" y="586">Version 2.30.3</text>
    <text class="muted body" x="410" y="578">2</text>
    <text class="muted body" x="560" y="578">0</text>
    <rect class="chip" x="690" y="554" width="68" height="30" rx="15"/>
    <text class="text small" x="707" y="574">Active</text>
    <text class="muted body" x="802" y="578">up</text>
    <text class="muted body" x="852" y="578">refresh</text>
    <text class="accent body" x="910" y="578">edit</text>
    <line class="soft-line" x1="24" y1="620" x2="920" y2="620"/>

    <!-- selected details -->
    <text class="muted h3" x="0" y="718">SELECTED ADDON</text>
    <rect class="card2" x="0" y="738" width="944" height="222" rx="10"/>
    <text class="text h2" x="24" y="774">AIOMetadata</text>
    <text class="muted small" x="24" y="798">Metadata addon for movies, series, and anime. You choose the source.</text>
    <rect class="chip" x="24" y="826" width="74" height="30" rx="15"/>
    <text class="text small" x="42" y="846">Active</text>
    <rect class="chip" x="108" y="826" width="110" height="30" rx="15"/>
    <text class="muted small" x="126" y="846">3 resources</text>
    <rect class="chip" x="228" y="826" width="112" height="30" rx="15"/>
    <text class="muted small" x="246" y="846">432 catalogs</text>
    <rect class="chip" x="350" y="826" width="118" height="30" rx="15"/>
    <text class="muted small" x="368" y="846">Configurable</text>

    <text class="dim tiny" x="24" y="892">SUPPORTED</text>
    <text class="muted small" x="24" y="918">Movie / Series / Anime - catalog, meta, subtitles - 13 id rules</text>
    <text class="dim tiny" x="520" y="892">MANAGE</text>
    <rect class="field" x="520" y="904" width="94" height="36" rx="8"/>
    <text class="text small" x="540" y="927">Configure</text>
    <rect class="field" x="626" y="904" width="84" height="36" rx="8"/>
    <text class="text small" x="650" y="927">Refresh</text>
    <rect class="field" x="722" y="904" width="82" height="36" rx="8"/>
    <text class="text small" x="746" y="927">Disable</text>
    <rect x="816" y="904" width="88" height="36" rx="8" fill="#2c1922" stroke="#5c2338" stroke-width="1"/>
    <text class="danger small" x="842" y="927">Delete</text>
  </g>

  <!-- right panel -->
  <g transform="translate(1405,145)">
    <text class="text h1" x="0" y="20">Addons at a glance</text>
    <g transform="translate(0,58)">
      <text class="muted body" x="0" y="10">gear</text>
      <text class="text body" x="46" y="6">Installed</text>
      <text class="muted small" x="46" y="26">2 addons</text>
    </g>
    <g transform="translate(0,116)">
      <text class="muted body" x="0" y="10">info</text>
      <text class="text body" x="46" y="6">Catalogs</text>
      <text class="muted small" x="46" y="26">432 available</text>
    </g>
    <g transform="translate(0,174)">
      <text class="muted body" x="0" y="10">link</text>
      <text class="text body" x="46" y="6">Resources</text>
      <text class="muted small" x="46" y="26">5 active resources</text>
    </g>

    <text class="text h1" x="0" y="300">Quick Actions</text>
    <g transform="translate(0,340)">
      <text class="muted body" x="0" y="10">plus</text>
      <text class="text body" x="46" y="6">Install from URL</text>
      <text class="muted small" x="46" y="26">Paste manifest link</text>
    </g>
    <g transform="translate(0,398)">
      <text class="muted body" x="0" y="10">refresh</text>
      <text class="text body" x="46" y="6">Refresh all</text>
      <text class="muted small" x="46" y="26">Update addon catalogs</text>
    </g>
    <g transform="translate(0,456)">
      <text class="muted body" x="0" y="10">sort</text>
      <text class="text body" x="46" y="6">Manage order</text>
      <text class="muted small" x="46" y="26">Drag rows in the table</text>
    </g>
  </g>
</svg>
