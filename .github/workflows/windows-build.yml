name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [Spyder]
    # A changelog or docs edit changes no code, so it needs no 20-minute build.
    paths-ignore:
      - '**.md'

# A newer push makes an older run's result irrelevant: stop it instead of queueing two 20-minute builds.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

# Publishing the rolling Nightly release below needs to write to the repository's releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # services.gradle.org occasionally drops the TLS handshake on hosted runners.
      # Download the wrapper distribution up front with retries so a blip doesn't fail the job.
      - name: Warm up Gradle wrapper (retry)
        shell: pwsh
        # services.gradle.org hands the zip on to GitHub's release servers, which time out (504) at times. A mirror is tried
        # too, alternating with the official address. Safe because gradle-wrapper.properties pins distributionSha256Sum: the
        # wrapper refuses any download that is not byte for byte the official Gradle zip. Only this checkout's copy of the
        # properties is rewritten; nothing is committed.
        run: |
          $props = 'gradle/wrapper/gradle-wrapper.properties'
          if (-not (Select-String -Path $props -Pattern '^distributionSha256Sum=[0-9a-f]{64}$' -Quiet)) { throw "distributionSha256Sum must be pinned before a mirror is used" }
          $official = (Select-String -Path $props -Pattern '^distributionUrl=(.*)$').Matches[0].Groups[1].Value
          $zip = [regex]::Match($official, 'gradle-[0-9.]+-bin\.zip').Value
          $sources = @($official, "https\://mirrors.cloud.tencent.com/gradle/$zip")
          $ok = $false
          foreach ($i in 1..6) {
            $url = $sources[($i - 1) % $sources.Count]
            (Get-Content $props) -replace '^distributionUrl=.*$', "distributionUrl=$url" | Set-Content $props
            Write-Host "Gradle from $url"
            ./gradlew.bat --version
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Gradle wrapper download failed (attempt $i/6); retrying in $($i * 5)s"
            Start-Sleep -Seconds ($i * 5)
          }
          if (-not $ok) { throw "Could not download the Gradle wrapper after 6 attempts" }

      # libmpv + ffmpeg DLLs. The build auto-detects C:/msys64/ucrt64/bin, which the
      # runner image already has; we only need to install mpv into it.
      - name: Install libmpv (MSYS2)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm"
          # gcc compiles the patched libquickjs.dll (buildWindowsQuickJs); mpv does not pull it in.
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils"
          if (-not (Test-Path C:\msys64\ucrt64\bin\libmpv-2.dll)) { throw "libmpv-2.dll missing after install" }
          if (-not (Test-Path C:\msys64\ucrt64\bin\gcc.exe)) { throw "gcc.exe missing after install" }

      # WebView2 SDK headers + loader, needed to compile player_bridge.dll.
      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\libs | Out-Null
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2 -OutFile C:\libs\webview2.zip
          Expand-Archive C:\libs\webview2.zip -DestinationPath C:\libs\webview2 -Force
          if (-not (Test-Path C:\libs\webview2\build\native\include\WebView2.h)) { throw "WebView2.h missing" }

      # --no-configuration-cache -I .github/mirror.init.gradle on every Gradle step here: storing the configuration cache fails now and then on CI
      # ("Configuration cache state could not be cached", a Kotlin classpath snapshot provider), failing the build before
      # anything compiles. Each run configures from scratch anyway, so CI loses nothing by not storing it. Local builds keep it.
      # downloadWix=false on the test and portable steps: WiX only makes the MSI (its own step below), and its download from
      # GitHub's release servers times out (504) at times.
      # innertubex=true here too, the same as the distributable below: a different value changes the
      # compiled sources, so the two steps would each compile the whole app instead of sharing one compile.
      - name: Unit tests (music, pre-show, network)
        shell: pwsh
        run: >
          ./gradlew.bat :composeApp:desktopTest --no-configuration-cache -Pcompose.desktop.application.downloadWix=false -I .github/mirror.init.gradle
          --tests "com.nuvio.app.features.music.*"
          --tests "com.nuvio.app.features.preroll.*"
          --tests "com.nuvio.app.core.network.*"
          --tests "*Trivia*"
          "-Pnuvio.innertubex=true"
          "-Pnuvio.webview2.dir=C:/libs/webview2"
          "-Pnuvio.windows.libmpv.runtimeDir=C:/msys64/ucrt64/bin"
          "-Pnuvio.windows.allowWhisperAvfilter=true"
          "-Pnuvio.windows.bundleFullRuntime=true"
          "-Pnuvio.engine.optional=true"

      # Portable app folder: no WiX needed.
      - name: Build portable distributable
        shell: pwsh
        run: >
          ./gradlew.bat :composeApp:createReleaseDistributable --no-configuration-cache -Pcompose.desktop.application.downloadWix=false -I .github/mirror.init.gradle
          "-Pnuvio.innertubex=true"
          "-Pnuvio.webview2.dir=C:/libs/webview2"
          "-Pnuvio.windows.libmpv.runtimeDir=C:/msys64/ucrt64/bin"
          "-Pnuvio.windows.allowWhisperAvfilter=true"
          "-Pnuvio.windows.bundleFullRuntime=true"
          "-Pnuvio.engine.optional=true"

      # Fails the job if libmpv-2.dll (or anything it pulls in) imports a DLL that is not bundled,
      # instead of shipping a build that dies with "Unable to load libmpv-2.dll" on user machines.
      - name: Verify player runtime is complete
        shell: pwsh
        run: |
          $dll = Get-ChildItem composeApp\build\compose\binaries -Recurse -Filter player_bridge.dll |
                 Where-Object { $_.Directory.Parent.Name -eq 'app' -or $_.Directory.Name -eq 'app' } |
                 Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem composeApp\build\compose\binaries -Recurse -Filter player_bridge.dll | Select-Object -First 1 }
          if (-not $dll) { throw "player_bridge.dll not found in distributable" }
          ./scripts/verify-windows-runtime.ps1 -AppDir $dll.Directory.FullName

      - name: Zip portable build
        shell: pwsh
        run: |
          $app = Get-ChildItem composeApp\build\compose\binaries -Directory -Recurse |
                 Where-Object { $_.Parent.Name -eq 'app' } | Select-Object -First 1
          if (-not $app) { throw "distributable not found" }
          Compress-Archive -Path $app.FullName -DestinationPath NuvioHTPC-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioHTPC-portable
          path: NuvioHTPC-portable.zip

      # The in-app updater (AppUpdater.kt) follows this fork's rolling "Nightly" prerelease cut from Spyder, so
      # every green build replaces it with the new portable zip. Deleting and recreating keeps one release
      # whose asset checksum changes with each build, which is how installed copies tell it is newer.
      - name: Publish Nightly release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release delete Nightly --cleanup-tag --yes 2>$null
          gh release create Nightly NuvioHTPC-portable.zip `
            --prerelease `
            --target Spyder `
            --title "Nightly (Spyder $sha)" `
            --notes "Portable build of Spyder at $sha. Installed copies on the Nightly channel update to this automatically."
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the Nightly release" }

      # MSI needs WiX 3.x and a full rebuild (--rerun-tasks), about 5 minutes, so it only runs when the
      # workflow is started by hand. Allowed to fail so the portable build still publishes.
      - name: Build MSI
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $wix = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1)
            if ($wix) { $env:PATH = "$($wix.FullName);$env:PATH" }
          }
          ./gradlew.bat :composeApp:packageReleaseMsi --no-configuration-cache -I .github/mirror.init.gradle --rerun-tasks `
            "-Pnuvio.innertubex=true" `
            "-Pnuvio.webview2.dir=C:/libs/webview2" `
            "-Pnuvio.windows.libmpv.runtimeDir=C:/msys64/ucrt64/bin" `
            "-Pnuvio.windows.allowWhisperAvfilter=true" `
            "-Pnuvio.windows.bundleFullRuntime=true" `
            "-Pnuvio.engine.optional=true"

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: NuvioHTPC-msi
          path: composeApp/build/compose/binaries/**/*.msi
          if-no-files-found: ignore
