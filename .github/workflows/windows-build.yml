name: Windows build

on:
  workflow_dispatch:
    inputs:
      build_msi:
        description: Also build the MSI installer (needs WiX, slower)
        type: boolean
        default: false
  push:
    branches: [main, Spyder, 'feature/**', 'merge/**']
    tags: ['v*']
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared Gradle flags: libmpv/WebView2 locations plus the CI escape hatches in composeApp/build.gradle.kts.
  GRADLE_FLAGS: >-
    -Pnuvio.webview2.dir=C:/libs/webview2
    -Pnuvio.windows.libmpv.runtimeDir=C:/msys64/ucrt64/bin
    -Pnuvio.windows.allowWhisperAvfilter=true
    -Pnuvio.engine.optional=true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # only used to attach the zip to a release on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # libmpv + ffmpeg DLLs. The build auto-detects C:/msys64/ucrt64/bin, which the runner image
      # already has; only mpv needs installing into it.
      - name: Install libmpv (MSYS2)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm"
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-mpv"
          if (-not (Test-Path C:\msys64\ucrt64\bin\libmpv-2.dll)) { throw "libmpv-2.dll missing after install" }

      # WebView2 SDK headers + loader, needed to compile player_bridge.dll.
      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\libs | Out-Null
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2 -OutFile C:\libs\webview2.zip
          Expand-Archive C:\libs\webview2.zip -DestinationPath C:\libs\webview2 -Force
          if (-not (Test-Path C:\libs\webview2\build\native\include\WebView2.h)) { throw "WebView2.h missing" }

      # Compiles the merged Kotlin first, so a compile error fails fast with a clear log.
      - name: Compile desktop
        shell: pwsh
        run: ./gradlew.bat :composeApp:compileKotlinDesktop --stacktrace ${{ env.GRADLE_FLAGS }}

      # Tests report but do not block the build: the merge is new and some may need updating.
      - name: Desktop unit tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: ./gradlew.bat :composeApp:desktopTest --continue ${{ env.GRADLE_FLAGS }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

      # Portable app folder: no WiX needed.
      - name: Build portable distributable
        shell: pwsh
        run: ./gradlew.bat :composeApp:createReleaseDistributable ${{ env.GRADLE_FLAGS }}

      - name: Zip portable build
        shell: pwsh
        run: |
          $app = Get-ChildItem composeApp\build\compose\binaries -Directory -Recurse |
                 Where-Object { $_.Parent.Name -eq 'app' } | Select-Object -First 1
          if (-not $app) { throw "distributable not found" }
          Compress-Archive -Path $app.FullName -DestinationPath Nuvio-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Nuvio-portable
          path: Nuvio-portable.zip

      - name: Attach to release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Nuvio-portable.zip

      # MSI needs WiX 3.x; manual runs only, and it may fail without losing the portable build.
      - name: Build MSI
        if: github.event_name == 'workflow_dispatch' && inputs.build_msi
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $wix = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1)
            if ($wix) { $env:PATH = "$($wix.FullName);$env:PATH" }
          }
          ./gradlew.bat :composeApp:packageReleaseMsi --rerun-tasks ${{ env.GRADLE_FLAGS }}

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_msi
        with:
          name: Nuvio-msi
          path: composeApp/build/compose/binaries/**/*.msi
          if-no-files-found: ignore
