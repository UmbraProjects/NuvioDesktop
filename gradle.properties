#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M
kotlin.native.jvmArgs=-Xmx12288M
kotlin.mpp.enableCInteropCommonization=true
# Incremental builds for commonMain. Without it Kotlin falls back to a full rebuild (~2.5 min) on any
# change to a common source (UNSAFE_INCREMENTAL_CHANGE_KT_62686), and nearly all of Nuvio is common;
# with it a one-file edit compiles in ~20 s. The "unsafe" part is expect/actual: after changing an
# expect or actual declaration, or before a release, rebuild cleanly
# (gradlew :composeApp:compileKotlinDesktop --rerun).
kotlin.internal.incremental.enableUnsafeOptimizationsForMultiplatform=true

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
org.gradle.configuration-cache=true
org.gradle.caching=true
# Daemon outlives the build and pins Claude Desktop's MSIX container, breaking its
# self-update relaunch (0x80070020). 3h default -> 15m.
org.gradle.daemon.idletimeout=900000

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#YouTube stream resolver for age-gated music tracks (InnerTubeX, from JitPack). Off here so a plain build needs
#no extra repository; CI turns it on with -Pnuvio.innertubex=true.
nuvio.innertubex=false
