# The JDK Gradle itself runs on, independent of JAVA_HOME. It is also the JDK the app ships: Compose's
# jlink/jpackage, the JNI headers for the native bridges and the base CDS dump all take
# java.home from this JVM. JDK 21 for -XX:+AutoCreateSharedArchive (see Docs/plans/jdk21-appcds-startup.md).
toolchainVersion=21
